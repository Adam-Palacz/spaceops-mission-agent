{{- if .Values.observability.paging.enabled }}
{{- $secretName := required "observability.paging.secret.name is required when paging is enabled" .Values.observability.paging.secret.name }}
{{- $secretKey := required "observability.paging.secret.key is required when paging is enabled" .Values.observability.paging.secret.key }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spaceops.fullname" . }}-alertmanager-config
  namespace: {{ include "spaceops.namespace" . }}
  labels:
    {{- include "spaceops.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |
    route:
      receiver: unpaged
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="page"
          receiver: pagerduty
    receivers:
      - name: unpaged
      - name: pagerduty
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/routing-key
            description: {{ `"{{ .CommonAnnotations.summary }}"` }}
            client: SpaceOps
            details:
              alertname: {{ `"{{ .CommonLabels.alertname }}"` }}
              route: {{ `"{{ .CommonLabels.route }}"` }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spaceops.fullname" . }}-alertmanager
  namespace: {{ include "spaceops.namespace" . }}
  labels:
    {{- include "spaceops.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.observability.paging.port }}
      targetPort: http
  selector:
    {{- include "spaceops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spaceops.fullname" . }}-alertmanager
  namespace: {{ include "spaceops.namespace" . }}
  labels:
    {{- include "spaceops.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "spaceops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: alertmanager
  template:
    metadata:
      labels:
        {{- include "spaceops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: alertmanager
    spec:
      serviceAccountName: {{ include "spaceops.componentServiceAccountName" (dict "root" . "component" "alertmanager") }}
      containers:
        - name: alertmanager
          image: {{ .Values.observability.paging.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: {{ .Values.observability.paging.port }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.observability.paging.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: paging-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "spaceops.fullname" . }}-alertmanager-config
        - name: paging-secret
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ $secretKey }}
                path: routing-key
{{- end }}
