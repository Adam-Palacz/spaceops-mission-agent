{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spaceops.fullname" . }}-secrets
  namespace: {{ include "spaceops.namespace" . }}
  labels:
    {{- include "spaceops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "spaceops.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.postgres.auth.secretKeys.password }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.postgresPassword | quote }}
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.openaiApiKey | quote }}
    - secretKey: APPROVAL_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.approvalApiKey | quote }}
    - secretKey: AUDIT_SIGNING_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.auditSigningKey | quote }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.githubToken | quote }}
    - secretKey: NGC_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.ngcApiKey | quote }}
    - secretKey: CURSOR_SH_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.cursorShApiKey | quote }}
    - secretKey: GPU_LLM_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.gpuLlmApiKey | quote }}
    {{- if .Values.observability.paging.enabled }}
    - secretKey: {{ .Values.observability.paging.secret.key }}
      remoteRef:
        key: {{ .Values.observability.paging.externalSecretRemoteKey | quote }}
    {{- end }}
{{- end }}
