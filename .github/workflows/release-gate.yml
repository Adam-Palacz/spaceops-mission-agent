name: PR3.1 Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      execute:
        description: Run blocking CI gates instead of plan-only validation
        required: true
        default: false
        type: boolean

jobs:
  release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: spaceops
          POSTGRES_PASSWORD: spaceops
          POSTGRES_DB: spaceops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceops -d spaceops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spaceops:spaceops@localhost:5432/spaceops
      POSTGRES_PASSWORD: spaceops
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: azure/setup-helm@v4

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Plan release gate
        if: github.event_name == 'pull_request' || inputs.execute != true
        run: >
          python scripts/release_gate_pr31.py
          --mode dry-run
          --release-id "${{ github.sha }}"
          --operator "${{ github.actor }}"
          --evidence artifacts/release-gates/${{ github.sha }}-plan.json

      - name: Execute blocking release gate
        if: github.event_name == 'workflow_dispatch' && inputs.execute == true
        run: >
          python scripts/release_gate_pr31.py
          --mode ci
          --release-id "${{ github.sha }}"
          --operator "${{ github.actor }}"
          --evidence artifacts/release-gates/${{ github.sha }}-ci.json

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: artifacts/release-gates/*.json
          if-no-files-found: error
